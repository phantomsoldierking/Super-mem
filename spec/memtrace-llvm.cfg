# SPEC CPU 2026 config: clang + MemTracePass instrumentation.
# Installed into $SPEC/config by spec/build_spec.sh, which defines %{tracer}.
%ifndef %{tracer}
%   error Define tracer= (absolute path of the tracer/build directory)
%endif
%ifndef %{build_ncpus}
%   define build_ncpus 10
%endif

default:
   label                = memtrace
   command_add_redirect = 1
   ignore_errors        = 1
   iterations           = 1
   makeflags            = --jobs=%{build_ncpus}
   output_format        = txt,csv
   reportable           = 0
   tune                 = base
   copies               = 1
   threads              = 1
   CC                   = clang   -std=c18
   CXX                  = clang++ -std=c++17
   CC_VERSION_OPTION    = --version
   CXX_VERSION_OPTION   = --version
   EXTRA_LIBS           = %{tracer}/memtrace_rt.o

default=base:
   OPTIMIZE  = -O2 -march=x86-64-v3 -fpass-plugin=%{tracer}/libMemTracePass.so

710.omnetpp_r,734.vpr_r,767.nest_r:
   PORTABILITY = -fno-finite-math-only
767.nest_r:
   PORTABILITY_LIBS = -lstdc++fs
